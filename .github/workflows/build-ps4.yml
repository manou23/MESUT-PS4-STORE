name: Build PS4 PKG

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-ps4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl tar clang lld unzip

      - name: Download and configure OpenOrbis Toolchain v0.5.4
        run: |
          mkdir -p "$HOME/OpenOrbisSDK"
          curl -fL --retry 3 "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o /tmp/openorbis.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openorbis.tar.gz -C "$HOME/OpenOrbisSDK"
          export OO_PS4_TOOLCHAIN="$HOME/OpenOrbisSDK/OpenOrbis/PS4Toolchain"
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          chmod +x -R "$OO_PS4_TOOLCHAIN/bin"
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$OO_PS4_TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"

      - name: Download package creation tools
        run: |
          curl -fL --retry 3 "https://github.com/OpenOrbis/create-gp4/releases/latest/download/binaries.tar.gz" -o /tmp/create-gp4.tar.gz
          tar -xzf /tmp/create-gp4.tar.gz -C "$OO_PS4_TOOLCHAIN"
          curl -fL --retry 3 "https://github.com/maxton/LibOrbisPkg/releases/download/v0.2/PkgTool.Core-0.2.231.zip" -o /tmp/pkgtool.zip
          unzip -o /tmp/pkgtool.zip -d "$OO_PS4_TOOLCHAIN/bin/linux"
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/"*

      - name: Build SDL2 for OpenOrbis
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/SDL-PS4.git SDL-PS4
          # The upstream helper uses a Clang-internal flag unsupported by Ubuntu's Clang 14.
          # Keep the same unwind-table behavior with the portable driver flag.
          sed -i 's/-Xclang -munwind-tables/-funwind-tables/' SDL-PS4/cmake/oosdk.cmake
          # The app is intentionally built without SDL audio; drop the stale PS4 audio bootstrap declaration.
          sed -i '/#define SDL_AUDIO_DRIVER_PS4[[:space:]]*1/d' SDL-PS4/include/SDL_config_ps4.h
          # OpenOrbis ships the controller header with an uppercase P; SDL's PS4 backend uses lowercase.
          # SDL's PS4 backend was written against Sony SDK names; map it to OpenOrbis headers and ABI names.
          sed -i 's|#include <pad.h>|#include <orbis/Pad.h>\n#include <orbis/UserService.h>|' SDL-PS4/src/joystick/ps4/SDL_sysjoystick.c
          sed -i '/#include <kernel.h>/d; /#include <libkernel.h>/d' SDL-PS4/src/joystick/ps4/SDL_sysjoystick.c
          perl -pi -e 's/\bSceUserServiceUserId\b/OrbisUserServiceUserId/g; s/\bSceUserServiceLoginUserIdList\b/OrbisUserServiceLoginUserIdList/g; s/\bScePadData\b/OrbisPadData/g; s/\bSCE_USER_SERVICE_MAX_LOGIN_USERS\b/ORBIS_USER_SERVICE_MAX_LOGIN_USERS/g; s/\bSCE_USER_SERVICE_USER_ID_INVALID\b/ORBIS_USER_SERVICE_USER_ID_INVALID/g; s/\bSCE_USER_SERVICE_ERROR_ALREADY_INITIALIZED\b/ORBIS_USER_SERVICE_ERROR_ALREADY_INITIALIZED/g; s/\bSCE_PAD_ERROR_ALREADY_OPENED\b/ORBIS_PAD_ERROR_ALREADY_OPENED/g; s/\bSCE_PAD_PORT_TYPE_STANDARD\b/ORBIS_PAD_PORT_TYPE_STANDARD/g; s/\bSCE_PAD_BUTTON_/ORBIS_PAD_BUTTON_/g; s/\bSCE_OK\b/ORBIS_OK/g' SDL-PS4/src/joystick/ps4/SDL_sysjoystick.c
          # Adapt the PS4 video backend to OpenOrbis' public VideoOut and kernel types.
          sed -i '/#include "SDL_ps4video.h"/a #include <libkernel.h>' SDL-PS4/src/video/ps4/SDL_ps4video.c
          perl -pi -e 's/\bSceKernelEvent\b/OrbisKernelEvent/g; s/\bSceVideoOutResolutionStatus\b/OrbisVideoOutResolutionStatus/g; s/\bSceKernelEqueue\b/OrbisKernelEqueue/g; s/\bSceVideoOutBufferAttribute\b/OrbisVideoOutBufferAttribute/g; s/\bSceVideoOutFlipStatus\b/OrbisVideoOutFlipStatus/g; s/\bSCE_KERNEL_MAIN_DMEM_SIZE\b/ORBIS_KERNEL_MAIN_DMEM_SIZE/g; s/\bSCE_KERNEL_PROT_CPU_RW\b/ORBIS_KERNEL_PROT_CPU_RW/g; s/\bSCE_KERNEL_PROT_GPU_RW\b/ORBIS_KERNEL_PROT_GPU_RW/g; s/\bSCE_KERNEL_WC_GARLIC\b/ORBIS_KERNEL_WC_GARLIC/g; s/\bSCE_USER_SERVICE_USER_ID_SYSTEM\b/ORBIS_USER_SERVICE_USER_ID_SYSTEM/g; s/\bSCE_VIDEO_OUT_ASPECT_RATIO_16_9\b/ORBIS_VIDEO_OUT_ASPECT_RATIO_16_9/g; s/\bSCE_VIDEO_OUT_BUS_TYPE_MAIN\b/ORBIS_VIDEO_OUT_BUS_MAIN/g; s/\bSCE_VIDEO_OUT_FLIP_MODE_VSYNC\b/ORBIS_VIDEO_OUT_FLIP_VSYNC/g; s/\bSCE_VIDEO_OUT_PIXEL_FORMAT_A8B8G8R8_SRGB\b/ORBIS_VIDEO_OUT_PIXEL_FORMAT_A8B8G8R8_SRGB/g; s/\bSCE_VIDEO_OUT_TILING_MODE_LINEAR\b/ORBIS_VIDEO_OUT_TILING_MODE_LINEAR/g; s/\bSCE_OK\b/ORBIS_OK/g; s/\.fullWidth\b/.width/g; s/\.fullHeight\b/.height/g; s/\.aspectRatio\b/.aspect/g; s/\.pixelFormat\b/.format/g; s/\.tilingMode\b/.tmode/g; s/\.pitchInPixel\b/.pixelPitch/g' SDL-PS4/src/video/ps4/SDL_ps4video.c SDL-PS4/src/video/ps4/SDL_ps4video.h
          # SDL enables this warning as an error even though the project is compiled as C99.
          # C99 permits mixed declarations and statements, so keep the diagnostic non-fatal.
          grep -RIl -- '-Werror=declaration-after-statement' SDL-PS4 | xargs -r sed -i 's/-Werror=declaration-after-statement/-Wno-error=declaration-after-statement/g'
          cmake -S SDL-PS4 -B SDL-PS4/orbis -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/SDL-PS4/cmake/oosdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_AUDIO=OFF
          cmake --build SDL-PS4/orbis --parallel 2
          SDL_LIB="$(find SDL-PS4/orbis -name 'libSDL2.a' -print -quit)"
          test -n "$SDL_LIB"
          cp "$SDL_LIB" "$OO_PS4_TOOLCHAIN/lib/libSDL2.a"

      - name: Build native application and package
        working-directory: app
        run: |
          python3 ../tools/generate_catalog.py ../data/catalog.json MESUTPS4Store/catalog_generated.h
          make clean
          make
          test -s "IV0000-MSTP00001_00-MESUTPS4STORE001.pkg"

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MESUT-PS4-STORE-1.0.0
          path: app/IV0000-MSTP00001_00-MESUTPS4STORE001.pkg
          if-no-files-found: error
          retention-days: 14
