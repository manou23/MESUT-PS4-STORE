name: Bug report
description: Report a reproducible problem in MESUT PS4 STORE
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve MESUT PS4 STORE. Search existing issues first and never include account credentials, console IDs, or private data."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build / PKG
        - Installation
        - Startup / crash
        - Controller navigation
        - Display / UI
        - Catalogue / metadata
        - Download / package verification
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version or commit
      placeholder: "e.g. unreleased commit SHA, or not yet installed"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: PS4 firmware and environment
      placeholder: "Exact firmware and homebrew environment, if known"
    validations:
      required: false
  - type: input
    id: console
    attributes:
      label: Console model
      placeholder: "PS4 / Slim / Pro (optional)"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, from launch to the problem.
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or video
      description: Remove usernames, tokens, serial numbers, and other private information before posting.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have removed private information from attachments and logs.
          required: true
