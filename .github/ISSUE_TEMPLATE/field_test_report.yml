name: PS4 field test report
description: Submit results from testing a published build on real PS4 hardware
title: "[Test report]: "
body:
  - type: markdown
    attributes:
      value: "Use this form only after a public test build is announced. A successful CI build is not proof of real-console compatibility. Never post console IDs, account details, or private keys."
  - type: input
    id: build
    attributes:
      label: Exact build / release
      placeholder: "Release tag or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Console model
      options:
        - PS4
        - PS4 Slim
        - PS4 Pro
        - Prefer not to say
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: "Exact version, if known"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Homebrew environment
      placeholder: "Environment / loader version, if known"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: Installation result
      options:
        - Installed successfully
        - Installation failed
        - Not tested
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: Launch result
      options:
        - Launched successfully
        - Crashed / returned to menu
        - Black screen / freeze
        - Not tested
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller navigation
      options:
        - All tested controls work
        - Some controls fail
        - Navigation is unusable
        - Not tested
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What worked and what did not?
      description: Include exact steps and any error text.
    validations:
      required: true
  - type: textarea
    id: suggestions
    attributes:
      label: Improvement suggestions
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Photos / video / logs
      description: Remove all personal or identifying information.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I tested the exact build named above on the stated hardware, or clearly marked any untested result.
          required: true
        - label: I removed personal information from all attachments.
          required: true
